<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAGO - Dashboard Dapur</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .connection-status.connected { background: #d4edda; color: #155724; }
        .connection-status.disconnected { background: #f8d7da; color: #721c24; }
        .connection-status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .connection-status.connected .dot { background: #28a745; }
        .connection-status.disconnected .dot { background: #dc3545; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .order-count-badge {
            background: #dc3545; color: white;
            padding: 4px 10px; border-radius: 12px;
            font-size: 14px; font-weight: bold; margin-left: 10px;
        }

        .auth-error { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .auth-error h2 { color: #dc3545; margin-bottom: 10px; }
        .auth-error p { color: #6c757d; margin-bottom: 20px; }

        .filter-tabs {
            display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap;
        }
        .filter-tab {
            padding: 8px 18px; border-radius: 20px; border: 2px solid #dee2e6;
            background: white; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .filter-tab:hover { border-color: #0f3460; color: #0f3460; }
        .filter-tab.active { background: #0f3460; color: white; border-color: #0f3460; }
        .filter-tab .tab-count {
            background: rgba(0,0,0,0.1); padding: 1px 8px; border-radius: 10px; font-size: 12px;
        }
        .filter-tab.active .tab-count { background: rgba(255,255,255,0.25); }

        .kitchen-columns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;
        }
        .kitchen-column { background: #f8f9fa; border-radius: 16px; padding: 16px; }
        .kitchen-column-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid #dee2e6;
        }
        .kitchen-column-header h2 { margin: 0; font-size: 1.15em; display: flex; align-items: center; gap: 8px; }
        .column-count { background: #6c757d; color: white; padding: 2px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; }
        .column-pending .column-count { background: #e67e22; }
        .column-processing .column-count { background: #3498db; }
        .column-completed .column-count { background: #27ae60; }

        .cards-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .kitchen-card {
            background: white; border-radius: 12px; padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #dee2e6;
            transition: transform 0.2s;
        }
        .kitchen-card:hover { transform: translateY(-2px); }
        .kitchen-card.status-pending { border-left-color: #e67e22; }
        .kitchen-card.status-processing { border-left-color: #3498db; }
        .kitchen-card.status-completed { border-left-color: #27ae60; }

        .kitchen-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .kitchen-card-header h3 { margin: 0; font-size: 1em; }
        .kitchen-card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 0.82em; color: #495057; }
        .kitchen-card-meta span { display: inline-flex; align-items: center; gap: 3px; }

        .kitchen-items { list-style: none; padding: 6px 8px; margin: 0 0 10px 0; background: #f8f9fa; border-radius: 8px; }
        .kitchen-items li { padding: 3px 0; font-size: 0.85em; border-bottom: 1px solid #eee; }
        .kitchen-items li:last-child { border-bottom: none; }
        .item-qty { font-weight: 700; color: #0f3460; margin-right: 4px; }
        .item-note { font-style: italic; color: #888; font-size: 0.9em; }

        .kitchen-card-actions { display: flex; gap: 6px; }
        .btn-start-process { background: #3498db; color: white; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; flex: 1; transition: background 0.2s; }
        .btn-start-process:hover { background: #2980b9; }
        .btn-mark-ready { background: #27ae60; color: white; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; flex: 1; transition: background 0.2s; }
        .btn-mark-ready:hover { background: #219a52; }
        .btn-done { background: #6c757d; color: white; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; flex: 1; transition: background 0.2s; }
        .btn-done:hover { background: #5a6268; }

        .empty-column { text-align: center; padding: 30px 16px; color: #adb5bd; font-size: 0.95em; grid-column: 1 / -1; }
        .no-orders { text-align: center; padding: 40px; color: #6c757d; font-size: 1.1em; }
        .order-time { font-size: 0.8em; color: #888; }

        .status-label {
            display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .status-label.pending { background: #fff3e0; color: #e65100; }
        .status-label.processing { background: #e3f2fd; color: #1565c0; }
        .status-label.completed { background: #e8f5e9; color: #2e7d32; }

        @media (max-width: 768px) {
            .kitchen-columns { grid-template-columns: 1fr; }
            .cards-grid { grid-template-columns: 1fr; }
            .filter-tabs { gap: 6px; }
            .filter-tab { padding: 6px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="auth-gate"></div>
    <div class="container" id="main-content" style="display:none;">
        <header>
            <div style="display:flex; align-items:center; gap:12px;">
                <h1>Dashboard Dapur</h1>
                <span id="order-count" class="order-count-badge" style="display:none;">0</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span id="connection-status" class="connection-status disconnected">
                    <span class="dot"></span>
                    <span id="connection-text">Disconnected</span>
                </span>
                <button class="btn-logout" onclick="location.reload()">Refresh</button>
                <button class="btn-logout" onclick="doLogout()">Keluar</button>
            </div>
        </header>

        <div id="loading">Menyambungkan ke server realtime...</div>

        <div class="filter-tabs" id="filter-tabs" style="display:none;">
            <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
                Semua <span class="tab-count" id="count-all">0</span>
            </button>
            <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">
                Antrian <span class="tab-count" id="count-pending">0</span>
            </button>
            <button class="filter-tab" data-filter="processing" onclick="setFilter('processing')">
                Diproses <span class="tab-count" id="count-processing">0</span>
            </button>
            <button class="filter-tab" data-filter="completed" onclick="setFilter('completed')">
                Selesai <span class="tab-count" id="count-completed">0</span>
            </button>
        </div>

        <div id="kitchen-content"></div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        var currentFilter = 'all';
        var allOrders = [];

        (function() {
            var token = getToken();
            var role = getUserRole();

            if (!token || role !== 'dapur') {
                document.getElementById('auth-gate').innerHTML =
                    '<div class="container"><div class="auth-error">' +
                    '<h2>Akses Ditolak</h2>' +
                    '<p>Anda harus login sebagai Dapur untuk mengakses halaman ini.</p>' +
                    '<a href="/login.html" class="btn-action">Login</a>' +
                    '</div></div>';
                document.getElementById('main-content').style.display = 'none';
                return;
            }

            document.getElementById('main-content').style.display = 'block';
            initKitchenDashboard();
        })();

        function doLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login.html';
        }

        function setFilter(filter) {
            currentFilter = filter;
            var tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(function(tab) {
                tab.classList.toggle('active', tab.getAttribute('data-filter') === filter);
            });
            renderFromAllOrders();
        }

        function updateTabCounts(orders) {
            var pending = orders.filter(function(o) { return o.status === 'pending'; }).length;
            var processing = orders.filter(function(o) { return o.status === 'processing'; }).length;
            var completed = orders.filter(function(o) { return o.status === 'completed'; }).length;

            document.getElementById('count-all').textContent = orders.length;
            document.getElementById('count-pending').textContent = pending;
            document.getElementById('count-processing').textContent = processing;
            document.getElementById('count-completed').textContent = completed;
        }

        function renderFromAllOrders() {
            var filtered;
            if (currentFilter === 'all') {
                filtered = allOrders;
            } else {
                filtered = allOrders.filter(function(o) { return o.status === currentFilter; });
            }
            renderOrders(filtered);
        }

        function initKitchenDashboard() {
            var kitchenContent = document.getElementById('kitchen-content');
            var loading = document.getElementById('loading');
            var connectionStatus = document.getElementById('connection-status');
            var connectionText = document.getElementById('connection-text');
            var orderCount = document.getElementById('order-count');
            var filterTabs = document.getElementById('filter-tabs');

            var previousOrderIds = new Set();
            var isFirstLoad = true;

            function updateConnectionStatus(connected) {
                if (connected) {
                    connectionStatus.className = 'connection-status connected';
                    connectionText.textContent = 'Realtime';
                } else {
                    connectionStatus.className = 'connection-status disconnected';
                    connectionText.textContent = 'Disconnected';
                }
            }

            function formatTime(isoStr) {
                if (!isoStr) return '';
                try {
                    var d = new Date(isoStr);
                    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                } catch (e) { return ''; }
            }

            function renderOrders(orders) {
                loading.style.display = 'none';
                filterTabs.style.display = 'flex';

                var currentOrderIds = new Set(orders.map(function(o) { return o.id; }));
                if (!isFirstLoad) {
                    orders.forEach(function(order) {
                        if (!previousOrderIds.has(order.id) && order.status === 'pending') {
                            playNotifSound();
                        }
                    });
                }
                previousOrderIds = currentOrderIds;
                isFirstLoad = false;

                var activeCount = allOrders.filter(function(o) {
                    return o.status === 'pending' || o.status === 'processing';
                }).length;

                if (activeCount > 0) {
                    orderCount.style.display = 'inline-block';
                    orderCount.textContent = activeCount;
                } else {
                    orderCount.style.display = 'none';
                }

                updateTabCounts(allOrders);

                if (orders.length === 0) {
                    kitchenContent.innerHTML = '<p class="no-orders">Tidak ada pesanan</p>';
                    return;
                }

                var pendingOrders = orders.filter(function(o) { return o.status === 'pending'; });
                var processingOrders = orders.filter(function(o) { return o.status === 'processing'; });
                var completedOrders = orders.filter(function(o) { return o.status === 'completed'; });

                var html = '<div class="kitchen-columns">';

                if (currentFilter === 'all' || currentFilter === 'pending') {
                    html += '<div class="kitchen-column column-pending">' +
                        '<div class="kitchen-column-header">' +
                            '<h2>Antrian</h2>' +
                            '<span class="column-count">' + pendingOrders.length + '</span>' +
                        '</div>' +
                        '<div class="cards-grid">' +
                        (pendingOrders.length === 0
                            ? '<div class="empty-column">Tidak ada pesanan baru</div>'
                            : pendingOrders.map(function(o) { return renderCard(o, 'pending'); }).join('')) +
                        '</div></div>';
                }

                if (currentFilter === 'all' || currentFilter === 'processing') {
                    html += '<div class="kitchen-column column-processing">' +
                        '<div class="kitchen-column-header">' +
                            '<h2>Diproses</h2>' +
                            '<span class="column-count">' + processingOrders.length + '</span>' +
                        '</div>' +
                        '<div class="cards-grid">' +
                        (processingOrders.length === 0
                            ? '<div class="empty-column">Tidak ada pesanan diproses</div>'
                            : processingOrders.map(function(o) { return renderCard(o, 'processing'); }).join('')) +
                        '</div></div>';
                }

                html += '</div>';

                if ((currentFilter === 'all' || currentFilter === 'completed') && completedOrders.length > 0) {
                    html += '<div class="kitchen-column column-completed" style="margin-top:20px;">' +
                        '<div class="kitchen-column-header">' +
                            '<h2>Selesai</h2>' +
                            '<span class="column-count">' + completedOrders.length + '</span>' +
                        '</div>' +
                        '<div class="cards-grid">' +
                        completedOrders.map(function(o) { return renderCard(o, 'completed'); }).join('') +
                        '</div></div>';
                }

                kitchenContent.innerHTML = html;
            }

            function renderCard(order, status) {
                var statusLabel = status === 'pending' ? 'Antrian' : status === 'processing' ? 'Diproses' : 'Selesai';
                var typeLabel = order.order_type === 'qr' ? 'QR' : order.order_type === 'dine_in' ? 'Dine In' : order.order_type === 'takeaway' ? 'Take Away' : 'Kasir';

                var btnHtml = '';
                if (status === 'pending') {
                    btnHtml = '<button onclick="updateStatus(\'' + order.id + '\', \'processing\')" class="btn-start-process">Mulai Proses</button>';
                } else if (status === 'processing') {
                    btnHtml = '<button onclick="updateStatus(\'' + order.id + '\', \'completed\')" class="btn-mark-ready">Tandai Selesai</button>';
                } else {
                    btnHtml = '<button onclick="updateStatus(\'' + order.id + '\', \'paid\')" class="btn-done">Sudah Dibayar</button>';
                }

                var itemsHtml = order.items.map(function(item) {
                    var note = item.note ? ' <span class="item-note">(' + item.note + ')</span>' : '';
                    return '<li><span><span class="item-qty">' + item.qty + 'x</span> ' + item.name + note + '</span></li>';
                }).join('');

                var time = formatTime(order.created_at);

                return '<div class="kitchen-card status-' + status + '" id="order-' + order.id + '">' +
                    '<div class="kitchen-card-header">' +
                        '<h3>#' + order.order_number + '</h3>' +
                        '<span class="status-label ' + status + '">' + statusLabel + '</span>' +
                    '</div>' +
                    '<div class="kitchen-card-meta">' +
                        '<span>Meja ' + (order.table_id || '-') + '</span>' +
                        '<span>' + typeLabel + '</span>' +
                        (time ? '<span class="order-time">' + time + '</span>' : '') +
                    '</div>' +
                    '<ul class="kitchen-items">' + itemsHtml + '</ul>' +
                    '<div class="kitchen-card-actions">' + btnHtml + '</div>' +
                '</div>';
            }

            window.updateStatus = function(orderId, status) {
                updateOrderStatus(orderId, status).catch(function(err) {
                    alert('Gagal update status: ' + err.message);
                });
            };

            function handleOrders(orders) {
                allOrders = orders.filter(function(o) {
                    return o && o.id && o.status && (o.status === 'pending' || o.status === 'processing' || o.status === 'completed');
                });
                renderFromAllOrders();
            }

            function startPolling() {
                updateConnectionStatus(false);
                connectionText.textContent = 'Polling (10s)';

                function loadKitchenOrders() {
                    fetch('/api/order/', { cache: 'no-store' })
                        .then(function(res) { return res.json(); })
                        .then(function(orders) {
                            if (Array.isArray(orders)) {
                                handleOrders(orders);
                            } else {
                                console.error('Response bukan array:', orders);
                                loading.textContent = 'Format data tidak valid';
                            }
                        })
                        .catch(function(err) {
                            console.error('Polling error:', err);
                            loading.textContent = 'Gagal memuat pesanan - ' + err.message;
                        });
                }

                loadKitchenOrders();
                setInterval(loadKitchenOrders, 10000);
            }

            startPolling();

            try {
                if (typeof initFirebase === 'function' && initFirebase()) {
                    var unsub = listenKitchenOrders(function(orders) {
                        handleOrders(orders);
                        updateConnectionStatus(true);
                        connectionText.textContent = 'Realtime';
                    });

                    if (unsub) {
                        window.addEventListener('beforeunload', function() { unsub(); });
                    }
                }
            } catch (e) {
                console.warn('Firebase realtime not available, using polling only');
            }
        }

        function playNotifSound() {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.value = 0.3;
                osc.start();
                setTimeout(function() { osc.frequency.value = 1000; }, 100);
                setTimeout(function() { osc.frequency.value = 800; }, 200);
                setTimeout(function() { osc.stop(); }, 300);
            } catch (e) {}
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/realtime.js"></script>
</body>
</html>
